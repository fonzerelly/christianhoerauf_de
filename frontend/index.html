<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Christian Hörauf</title>
    <meta name="description" content="Hier entsteht die Internetpräsenz von Christian Hörauf." />
    <!-- Kein Symbolbild: verhindert, dass der Browser vergeblich nach favicon.ico fragt. -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <script>
      // Das Geräteprofil schon vor dem ersten Bild, damit beim Laden nichts springt (das Layout
      // hängt an data-profile). main.ts setzt es danach endgültig, auch mit ?profile=. Die Grenze
      // ist DESKTOP_FROM_WIDTH aus config/tuning.ts.
      document.body.dataset.profile = window.innerWidth >= 700 ? "desktop" : "handy";
    </script>
    <noscript>
      <p class="noscript-hint">
        Hier entsteht die Internetpräsenz von Christian Hörauf.<br />
        Für die Darstellung dieser Seite wird JavaScript benötigt.
      </p>
    </noscript>
    <!-- Von oben nach unten (ADR 0007): Bühne fester Höhe, Zeitleiste, Antwortbereich, Folgefragen,
         Fragefeld, Hinweis. main.ts setzt die Höhe der Bühne und Anfang und Breite des Labyrinths
         (--maze-left, --maze-width); Zeitleiste und Fragefeld stehen bündig darunter. -->
    <main id="page">
      <!-- Kopf: Name, Rolle, Kontakt (Q13, Q33). „Lebenslauf als PDF“ kommt, wenn es den Endpunkt
           gibt (Q28). Am Handy steht „Kontakt“ in der Fußzeile. -->
      <header id="header">
        <h1>Christian Hörauf</h1>
        <p id="role">Softwareentwickler · seit 2004</p>
        <nav class="header-links" aria-label="Kontakt">
          <a href="impressum.html#kontakt">Kontakt</a>
        </nav>
      </header>
      <div id="stage">
        <canvas id="maze" aria-hidden="true"></canvas>
      </div>
      <!-- Die Stationen aus /lebenslauf, auf- und zuklappbar (Schritt 12.9 und 12.10). -->
      <section id="timeline" aria-label="Werdegang" hidden></section>
      <!-- Die Frage klein, die Antwort als Text. Screenreader lesen von hier vor (das Canvas
           sehen sie nicht). -->
      <section id="answer-area" aria-label="Antwort" aria-live="polite" hidden></section>
      <!-- Folgefragen als Knöpfe; ein Klick trägt sie ins Fragefeld ein. -->
      <div id="suggestions" aria-label="Folgefragen" hidden></div>
      <form id="ask-form" autocomplete="off">
        <input
          type="text"
          id="question"
          placeholder="Ihre Frage …"
          aria-label="Ihre Frage"
          maxlength="500"
          enterkeyhint="send"
          autocapitalize="sentences"
          spellcheck="true"
        />
        <button type="submit" id="send">Senden</button>
      </form>
      <!-- Hinweis zur Verarbeitung der Fragen (Datenschutz) und die Pflichtseiten. -->
      <footer id="notice">
        <p>
          Fragen werden von einem Sprachmodell bei AWS in Frankfurt beantwortet. Bitte keine
          persönlichen Daten eingeben.
        </p>
        <nav aria-label="Rechtliches">
          <a class="footer-contact" href="impressum.html#kontakt">Kontakt</a>
          <a href="datenschutz.html">Datenschutz</a>
          <a href="impressum.html">Impressum</a>
        </nav>
      </footer>
    </main>
    <!-- Das Stationsmenü: Einstiegsfragen zu einer Station; liegt über Antwort und Fragefeld (Q44). -->
    <div id="station-menu" aria-label="Fragen zu dieser Station" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
