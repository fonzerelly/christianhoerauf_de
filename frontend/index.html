<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Christian Hörauf</title>
    <meta name="description" content="Hier entsteht die Internetpräsenz von Christian Hörauf." />
    <!-- Kein Symbolbild: verhindert, dass der Browser vergeblich nach favicon.ico fragt. -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Der Text steckt sonst nur im Canvas. Hier steht er für Screenreader und Suchmaschinen. -->
    <h1 class="visually-hidden">Hier entsteht die Internetpräsenz von Christian Hörauf</h1>
    <noscript>
      <p class="noscript-hint">
        Hier entsteht die Internetpräsenz von Christian Hörauf.<br />
        Für die Darstellung dieser Seite wird JavaScript benötigt.
      </p>
    </noscript>
    <main id="stage">
      <canvas id="maze" aria-hidden="true"></canvas>
      <!-- Screenreader sehen das Canvas nicht: Hier steht jede Antwort zusätzlich als Text. -->
      <div id="spoken-answer" class="visually-hidden" aria-live="polite"></div>
      <!-- Schaltet das Brummen der Bildröhre an und aus. Beim Laden ist es aus. -->
      <button
        type="button"
        id="sound-toggle"
        aria-label="Brummen der Bildröhre"
        title="Brummen der Bildröhre an- und ausschalten"
        aria-pressed="false"
      >
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
          <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" />
          <g
            class="waves"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <path d="M16 9a4 4 0 0 1 0 6" />
            <path d="M18.5 6.5a8 8 0 0 1 0 11" />
          </g>
          <g
            class="muted"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <path d="M16 9l5 6" />
            <path d="M21 9l-5 6" />
          </g>
        </svg>
      </button>
    </main>
    <form id="ask-form" autocomplete="off">
      <input
        type="text"
        id="question"
        placeholder="Deine Frage …"
        aria-label="Deine Frage"
        maxlength="200"
        enterkeyhint="send"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
      />
      <button type="submit" id="send">Senden</button>
      <button
        type="button"
        id="replay"
        title="Das zuletzt Geschriebene nochmal schreiben"
        aria-label="Das zuletzt Geschriebene nochmal schreiben"
      >
        Nochmal
      </button>
    </form>
    <!-- Hinweis zur Verarbeitung der Fragen (Datenschutz) und die Pflichtseiten. -->
    <footer id="notice">
      <p>
        Fragen werden von einem Sprachmodell bei AWS in Frankfurt beantwortet. Bitte keine
        persönlichen Daten eingeben.
      </p>
      <nav aria-label="Rechtliches">
        <a href="/datenschutz.html">Datenschutz</a>
        <a href="/impressum.html">Impressum</a>
      </nav>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
