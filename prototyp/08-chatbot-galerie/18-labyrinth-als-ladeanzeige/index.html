<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>18 · Labyrinth als Ladeanzeige</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #fafaf8; color: #1c1c1c; }
  .chat { width: min(680px, 94vw); margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 30px 0 16px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  header canvas { border-radius: 10px; }
  header b { font-size: 20px; display: block; } header small { color: #777; }
  #verlauf { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .n { line-height: 1.6; max-width: 88%; }
  .ich { align-self: flex-end; background: #1c1c1c; color: white; padding: 10px 14px; border-radius: 14px 14px 2px 14px; }
  .bot { display: flex; gap: 12px; align-items: flex-start; }
  .bot canvas { flex-shrink: 0; border-radius: 8px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .chips button { border: 1px solid #ccc; background: white; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  form { display: flex; gap: 8px; }
  input { flex: 1; border: 1px solid #ccc; border-radius: 12px; padding: 13px 16px; font-size: 16px; outline: none; }
  form button { background: #0b7a3b; color: white; border: none; border-radius: 12px; padding: 0 18px; cursor: pointer; }
</style>
</head>
<body>
<div class="chat">
  <header><canvas id="logo" width="48" height="48"></canvas><div><b>ChrisBot</b><small>Das Labyrinth ist jetzt nur noch das Logo – und der Denk-Kringel.</small></div></header>
  <div id="verlauf"></div>
  <div class="chips" id="chips"></div>
  <form id="formular"><input id="eingabe" placeholder="Frage stellen …" autocomplete="off"><button>Senden</button></form>
</div>
<script src="../gemeinsam/antworten.js"></script>
<script src="../gemeinsam/labyrinth-mini.js"></script>
<script>
  // Ein Mini-Labyrinth (6×6) als Avatar. Während der Bot denkt, läuft ein Lichtpunkt hindurch;
  // sobald die Antwort da ist, bleibt der Avatar stehen. Ersetzt die üblichen drei Punkte.
  function miniLabyrinth(canvas, animiert) {
    const ctx = canvas.getContext("2d");
    const n = 6, zelle = canvas.width / n;
    const lab = erzeugeLabyrinth(n, n);
    let i = 0, aktiv = animiert;
    function bild() {
      ctx.fillStyle = "#06200f"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      zeichneLabyrinth(ctx, lab, zelle, "#2bdc5a", 1.5);
      if (aktiv) {
        const z = lab.rundgang[Math.floor(i) % lab.rundgang.length];
        ctx.fillStyle = "#ff2a2a"; ctx.shadowColor = "#ff2a2a"; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(z.x * zelle + zelle / 2, z.y * zelle + zelle / 2, zelle / 4, 0, 7); ctx.fill();
        ctx.shadowBlur = 0;
        i += 0.35;
        requestAnimationFrame(bild);
      }
    }
    bild();
    return () => { aktiv = false; bild(); };
  }
  miniLabyrinth(document.getElementById("logo"), false);

  const verlauf = document.getElementById("verlauf");
  async function stelleFrage(frage) {
    const ich = document.createElement("div");
    ich.className = "n ich"; ich.textContent = frage;
    verlauf.appendChild(ich);
    const bot = document.createElement("div");
    bot.className = "n bot";
    bot.innerHTML = '<canvas width="36" height="36"></canvas><div>&nbsp;</div>';
    verlauf.appendChild(bot);
    const stopp = miniLabyrinth(bot.querySelector("canvas"), true);
    const { text } = await frageBot(frage, 1400);
    stopp();
    bot.lastChild.textContent = text;
    bot.scrollIntoView({ behavior: "smooth" });
  }
  document.getElementById("formular").addEventListener("submit", (e) => {
    e.preventDefault();
    const eingabe = document.getElementById("eingabe");
    if (eingabe.value.trim()) stelleFrage(eingabe.value.trim());
    eingabe.value = "";
  });
  VORSCHLAEGE.forEach((v) => {
    const b = document.createElement("button");
    b.textContent = v;
    b.onclick = () => stelleFrage(v);
    document.getElementById("chips").appendChild(b);
  });
</script>
</body>
</html>
