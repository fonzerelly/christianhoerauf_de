<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>36 · Telefon-Hotline</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #e7e3da; font-family: system-ui, sans-serif; display: grid; place-items: center; padding: 20px; }
  .telefon { width: 330px; background: #2b2b2b; border-radius: 36px; padding: 22px; box-shadow: 0 20px 50px #0006; color: #ddd; }
  .display { background: #9fb98a; color: #1c2a12; font-family: "Courier New", monospace; border-radius: 8px; padding: 12px; min-height: 140px; font-size: 14px; line-height: 1.35; box-shadow: inset 0 2px 6px #0006; white-space: pre-wrap; }
  .display b { display: block; border-bottom: 1px solid #1c2a12; margin-bottom: 6px; }
  .tasten { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
  .tasten button { height: 54px; border-radius: 50%; border: none; background: linear-gradient(#555, #3a3a3a); color: white; font-size: 22px; cursor: pointer; box-shadow: 0 3px 0 #111; }
  .tasten button:active { transform: translateY(2px); box-shadow: 0 1px 0 #111; }
  .tasten small { display: block; font-size: 8px; color: #aaa; letter-spacing: .1em; }
  .reihe { display: flex; gap: 10px; margin-top: 16px; }
  .reihe button { flex: 1; height: 44px; border-radius: 22px; border: none; font-size: 20px; cursor: pointer; }
  .gruen { background: #2f9e44; color: white; } .rot { background: #e03131; color: white; }
  .frei { margin-top: 14px; display: none; gap: 6px; } .frei.an { display: flex; }
  .frei input { flex: 1; border-radius: 8px; border: none; padding: 8px; }
  .frei button { border-radius: 8px; border: none; padding: 0 10px; cursor: pointer; }
  .warte { font-size: 11px; color: #888; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<div class="telefon">
  <div class="display" id="display"></div>
  <form class="frei" id="frei"><input id="eingabe" placeholder="Ihr Anliegen (Spracherkennung simuliert)" autocomplete="off"><button>OK</button></form>
  <div class="tasten" id="tasten"></div>
  <div class="reihe"><button class="gruen" id="anrufen">📞</button><button class="rot" id="auflegen">📵</button></div>
  <div class="warte" id="warte">Ton an für die volle Warteschleifen-Erfahrung.</div>
</div>
<script src="../gemeinsam/antworten.js"></script>
<script>
  // Sprachmenü wie bei einer Kundenhotline: 1–3 sind die drei Fragen, 4 ist "freies Anliegen",
  // 0 ist "Mitarbeiter sprechen" (Warteschleife mit Gedudel, Spoiler: das ist auch der Bot).
  const display = document.getElementById("display");
  let verbunden = false, audio, melodie;
  const MENUE = "Willkommen bei der ChrisBot-Hotline!\n1 – " + VORSCHLAEGE[0] + "\n2 – " + VORSCHLAEGE[1] + "\n3 – " + VORSCHLAEGE[2] + "\n4 – Anderes Anliegen\n0 – Mitarbeiter sprechen";
  function zeige(titel, text) { display.innerHTML = "<b></b>"; display.firstChild.textContent = titel; display.appendChild(document.createTextNode(text)); }
  function piep(f) { try { audio = audio || new AudioContext(); const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = f; g.gain.value = .08; o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + .12); } catch (e) {} }
  function warteschleife(an) {
    clearInterval(melodie);
    melodie = null; // null heißt: keine Warteschleife aktiv (die Schleife unten bricht dann ab)
    if (!an) return;
    const toene = [523, 659, 784, 659, 587, 698, 880, 698];
    let i = 0;
    melodie = setInterval(() => piep(toene[i++ % toene.length]), 300);
  }
  async function antworte(frage) {
    zeige("Bitte warten …", "Ihr Anruf ist uns wichtig.");
    const { text } = await frageBot(frage);
    zeige(frage, text + "\n\n# – zurück zum Menü");
  }
  async function taste(t) {
    piep(700 + Number(t || 0) * 40);
    if (!verbunden) { zeige("Kein Anruf", "Bitte zuerst 📞 drücken."); return; }
    if (t === "#") { warteschleife(false); document.getElementById("frei").classList.remove("an"); zeige("Hauptmenü", MENUE); }
    else if (["1", "2", "3"].includes(t)) antworte(VORSCHLAEGE[Number(t) - 1]);
    else if (t === "4") { zeige("Anderes Anliegen", "Bitte nennen Sie Ihr Anliegen nach dem Piep."); document.getElementById("frei").classList.add("an"); document.getElementById("eingabe").focus(); }
    else if (t === "0") {
      warteschleife(true);
      for (let platz = 7; platz > 0; platz--) {
        if (!melodie) return;
        zeige("Warteschleife", "Sie sind Anrufer Nr. " + platz + " in der Warteschlange.\nGeschätzte Wartezeit: " + platz * 3 + " Sekunden.\n\n# – Abbrechen");
        await new Promise((r) => setTimeout(r, 900));
      }
      warteschleife(false);
      antworte("Wer bist du?");
    } else zeige("Ungültige Eingabe", "Diese Taste ist leider nicht belegt.\n# – Hauptmenü");
  }
  ["1", "2", "3", "4", "5", "6", "7", "8", "9", "*", "0", "#"].forEach((t, i) => {
    const b = document.createElement("button");
    b.innerHTML = t + "<small>" + ["", "ABC", "DEF", "GHI", "JKL", "MNO", "PQRS", "TUV", "WXYZ", "", "+", ""][i] + "</small>";
    b.onclick = () => taste(t);
    document.getElementById("tasten").appendChild(b);
  });
  document.getElementById("anrufen").onclick = () => { verbunden = true; piep(440); zeige("Verbunden 00:00", MENUE); };
  document.getElementById("auflegen").onclick = () => { verbunden = false; warteschleife(false); zeige("Aufgelegt", "Danke für Ihren Anruf."); };
  document.getElementById("frei").addEventListener("submit", (e) => {
    e.preventDefault();
    const eingabe = document.getElementById("eingabe");
    if (eingabe.value.trim()) antworte(eingabe.value.trim());
    eingabe.value = "";
  });
  zeige("ChrisBot-Hotline", "0800 CHRISBOT\n\nGrünen Hörer drücken, um anzurufen.");
</script>
</body>
</html>
