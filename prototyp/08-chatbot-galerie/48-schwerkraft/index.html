<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>48 · Schwerkraft</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; background: #f5efe6; font-family: system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; }
  .leiste { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 1; flex-wrap: wrap; justify-content: center; width: min(760px, 96vw); }
  input { flex: 1; min-width: 200px; padding: 12px 16px; border: 2px solid #222; border-radius: 999px; font-size: 16px; outline: none; }
  .leiste button { border: 2px solid #222; background: white; border-radius: 999px; padding: 0 14px; cursor: pointer; font-weight: 600; }
  #schalter.aus { background: #222; color: white; }
  .hinweis { position: fixed; bottom: 12px; width: 100%; text-align: center; color: #887; font-size: 13px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="leinwand"></canvas>
<form class="leiste" id="formular"><input id="eingabe" placeholder="Frage – und dann gut festhalten" autocomplete="off"><button>Fragen</button><button type="button" id="schalter">Schwerkraft ausschalten</button><button type="button" id="vorschlag">Vorschlag</button></form>
<div class="hinweis">Die Antwort steht 2 Sekunden still, dann gewinnt die Physik. „Schwerkraft ausschalten“ setzt sie wieder zusammen. Ziehen mit der Maus schubst Buchstaben.</div>
<script src="../gemeinsam/antworten.js"></script>
<script>
  // Jeder Buchstabe ist ein Teilchen mit Zielposition (seine Stelle im gesetzten Text) und
  // aktueller Position. Mit Schwerkraft fällt er und stapelt sich am Boden; ohne Schwerkraft
  // federt er zurück an sein Ziel. Der Stapel ist ein einfaches Höhenprofil in 14-px-Spalten,
  // keine echte Kollision – reicht für den Effekt und bleibt schnell.
  const leinwand = document.getElementById("leinwand");
  const ctx = leinwand.getContext("2d");
  const SCHRIFT = 26, SPALTE = 14;
  let teilchen = [], schwerkraft = false, hoehe = [], maus = { x: -999, y: -999, vx: 0, vy: 0 }, fallTimer, wartetAufFall = false;

  function groesse() { leinwand.width = innerWidth; leinwand.height = innerHeight; hoehe = new Array(Math.ceil(innerWidth / SPALTE)).fill(0); }
  addEventListener("resize", groesse);
  groesse();

  function setzeText(text) {
    ctx.font = "700 " + SCHRIFT + "px system-ui";
    const breite = Math.min(760, innerWidth - 40), links = (innerWidth - breite) / 2;
    let x = links, y = 130;
    teilchen = [];
    for (const wort of text.split(" ")) {
      const w = ctx.measureText(wort + " ").width;
      if (x + w > links + breite) { x = links; y += SCHRIFT * 1.35; }
      for (const z of wort + " ") {
        const zb = ctx.measureText(z).width;
        if (z !== " ") teilchen.push({ z, x, y, tx: x, ty: y, vx: 0, vy: 0, ruht: false, winkel: 0, dreh: 0 });
        x += zb;
      }
    }
    hoehe.fill(0);
    schwerkraft = false;
    document.getElementById("schalter").textContent = "Schwerkraft ausschalten";
    clearTimeout(fallTimer);
    wartetAufFall = true;
    fallTimer = setTimeout(() => { wartetAufFall = false; schwerkraft = true; teilchen.forEach((t) => { t.vx = (Math.random() - 0.5) * 3; t.dreh = (Math.random() - 0.5) * 0.2; }); }, 2000);
  }
  function bild() {
    ctx.clearRect(0, 0, leinwand.width, leinwand.height);
    ctx.font = "700 " + SCHRIFT + "px system-ui";
    ctx.fillStyle = "#222";
    for (const t of teilchen) {
      if (schwerkraft && !t.ruht) {
        t.vy += 0.6; t.x += t.vx; t.y += t.vy; t.winkel += t.dreh;
        const spalte = Math.max(0, Math.min(hoehe.length - 1, Math.floor(t.x / SPALTE)));
        const boden = leinwand.height - hoehe[spalte] - 4;
        if (t.y >= boden) { t.y = boden; t.ruht = true; hoehe[spalte] += SCHRIFT * 0.7; }
        if (t.x < 0 || t.x > leinwand.width - 10) t.vx *= -1;
      } else if (!schwerkraft) {
        t.vx = (t.vx + (t.tx - t.x) * 0.08) * 0.78; t.vy = (t.vy + (t.ty - t.y) * 0.08) * 0.78;
        t.x += t.vx; t.y += t.vy; t.winkel *= 0.85;
      }
      // Mausschubser: Buchstaben in der Nähe der Maus bekommen deren Schwung ab
      if (Math.hypot(t.x - maus.x, t.y - maus.y) < 40 && (Math.abs(maus.vx) + Math.abs(maus.vy) > 4)) {
        if (t.ruht) { const s = Math.floor(t.x / SPALTE); if (hoehe[s]) hoehe[s] -= SCHRIFT * 0.7; t.ruht = false; }
        t.vx += maus.vx * 0.5; t.vy += maus.vy * 0.5 - 4; t.dreh = (Math.random() - 0.5) * 0.4;
      }
      ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.winkel); ctx.fillText(t.z, 0, 0); ctx.restore();
    }
    maus.vx *= 0.8; maus.vy *= 0.8;
    requestAnimationFrame(bild);
  }
  bild();
  addEventListener("pointermove", (e) => { maus.vx = e.clientX - maus.x; maus.vy = e.clientY - maus.y; maus.x = e.clientX; maus.y = e.clientY; });
  document.getElementById("schalter").onclick = () => {
    // Noch vor dem ersten Fall heißt "ausschalten": der Text bleibt einfach stehen.
    clearTimeout(fallTimer);
    if (wartetAufFall) { wartetAufFall = false; schwerkraft = false; } else schwerkraft = !schwerkraft;
    hoehe.fill(0);
    teilchen.forEach((t) => (t.ruht = false));
    document.getElementById("schalter").textContent = schwerkraft ? "Schwerkraft ausschalten" : "Schwerkraft einschalten";
    document.getElementById("schalter").classList.toggle("aus", !schwerkraft);
  };
  async function stelleFrage(frage) { setzeText((await frageBot(frage)).text); }
  document.getElementById("formular").addEventListener("submit", (e) => {
    e.preventDefault();
    const eingabe = document.getElementById("eingabe");
    if (eingabe.value.trim()) stelleFrage(eingabe.value.trim());
    eingabe.value = "";
  });
  let n = 0;
  document.getElementById("vorschlag").onclick = () => stelleFrage(VORSCHLAEGE[n++ % VORSCHLAEGE.length]);
  setzeText(findeAntwort(""));
</script>
</body>
</html>
