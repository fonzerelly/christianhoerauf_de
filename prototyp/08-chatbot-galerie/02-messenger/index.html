<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 · Messenger</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #d9dbd5; display: grid; place-items: center; min-height: 100vh; }
  .telefon { width: min(420px, 100vw); height: min(820px, 100vh); background: #efe7dd; display: flex; flex-direction: column; border-radius: 28px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.25);
    background-image: radial-gradient(circle at 20px 20px, rgba(0,0,0,.035) 2px, transparent 3px); background-size: 40px 40px; }
  header { background: #1f6f5c; color: white; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
  .bild { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #8fd3b6, #2b8a6e); display: grid; place-items: center; font-weight: 700; }
  header b { display: block; }
  header small { opacity: .8; }
  #verlauf { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 6px; }
  .tag { align-self: center; background: #fff8; font-size: 12px; padding: 4px 10px; border-radius: 8px; color: #555; margin: 6px 0; }
  .blase { max-width: 80%; padding: 7px 10px 18px; border-radius: 10px; position: relative; font-size: 15px; line-height: 1.35; box-shadow: 0 1px 1px rgba(0,0,0,.1); min-width: 70px; }
  .blase time { position: absolute; right: 8px; bottom: 3px; font-size: 11px; color: #667; }
  .bot { align-self: flex-start; background: white; border-top-left-radius: 0; }
  .ich { align-self: flex-end; background: #d4f5c4; border-top-right-radius: 0; }
  .ich time::after { content: " ✓✓"; color: #34b7f1; }
  .tippt { align-self: flex-start; background: white; padding: 10px 14px; border-radius: 10px; }
  .tippt span { display: inline-block; width: 7px; height: 7px; background: #999; border-radius: 50%; margin: 0 2px; animation: hops 1.2s infinite; }
  .tippt span:nth-child(2) { animation-delay: .2s; } .tippt span:nth-child(3) { animation-delay: .4s; }
  @keyframes hops { 30% { transform: translateY(-5px); } }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 10px 6px; }
  .chips button { white-space: nowrap; border: 1px solid #1f6f5c; color: #1f6f5c; background: white; border-radius: 16px; padding: 6px 12px; cursor: pointer; }
  form { display: flex; gap: 8px; padding: 8px 10px 14px; }
  input { flex: 1; border: none; border-radius: 24px; padding: 12px 16px; font-size: 15px; outline: none; }
  form button { width: 46px; height: 46px; border-radius: 50%; border: none; background: #1f6f5c; color: white; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>
<div class="telefon">
  <header><div class="bild">CH</div><div><b>Christian Hörauf</b><small id="status">online</small></div></header>
  <div id="verlauf"><div class="tag">Heute</div></div>
  <div class="chips" id="chips"></div>
  <form id="formular"><input id="eingabe" placeholder="Nachricht" autocomplete="off"><button>➤</button></form>
</div>
<script src="../gemeinsam/antworten.js"></script>
<script>
  const verlauf = document.getElementById("verlauf");
  const status = document.getElementById("status");
  const uhrzeit = () => new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });

  function blase(wer, text) {
    const el = document.createElement("div");
    el.className = "blase " + wer;
    el.textContent = text;
    const zeit = document.createElement("time");
    zeit.textContent = uhrzeit();
    el.appendChild(zeit);
    verlauf.appendChild(el);
    verlauf.scrollTop = verlauf.scrollHeight;
  }

  // Zeigt "tippt …" an, solange die Antwort unterwegs ist. Lange Antworten werden in
  // Sätze zerlegt und als mehrere Nachrichten geschickt, wie ein Mensch es tun würde.
  async function stelleFrage(frage) {
    blase("ich", frage);
    const tippt = document.createElement("div");
    tippt.className = "tippt";
    tippt.innerHTML = "<span></span><span></span><span></span>";
    verlauf.appendChild(tippt);
    status.textContent = "schreibt …";
    const { text } = await frageBot(frage);
    const saetze = text.match(/[^.!?]+[.!?]+/g) || [text];
    tippt.remove();
    for (const satz of saetze) {
      blase("bot", satz.trim());
      await new Promise((r) => setTimeout(r, 450));
    }
    status.textContent = "online";
  }

  document.getElementById("formular").addEventListener("submit", (e) => {
    e.preventDefault();
    const eingabe = document.getElementById("eingabe");
    if (!eingabe.value.trim()) return;
    stelleFrage(eingabe.value.trim());
    eingabe.value = "";
  });
  VORSCHLAEGE.forEach((v) => {
    const b = document.createElement("button");
    b.textContent = v;
    b.onclick = () => stelleFrage(v);
    document.getElementById("chips").appendChild(b);
  });
  blase("bot", findeAntwort(""));
</script>
</body>
</html>
