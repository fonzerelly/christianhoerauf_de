<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>08 · FAQ-Akkordeon</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #1f2937; }
  .inhalt { max-width: 720px; margin: 60px auto; padding: 0 22px; }
  h1 { font-size: 36px; margin-bottom: 6px; }
  .unter { color: #6b7280; margin-bottom: 36px; font-size: 18px; }
  details { border-bottom: 1px solid #e5e7eb; }
  summary { list-style: none; cursor: pointer; padding: 20px 0; font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-size: 26px; color: #9ca3af; transition: transform .25s; }
  details[open] summary::after { transform: rotate(45deg); }
  details p { margin: 0 0 20px; line-height: 1.7; color: #4b5563; animation: auf .3s ease; }
  @keyframes auf { from { opacity: 0; transform: translateY(-6px); } }
  .eigene { margin-top: 40px; background: #f3f4f6; border-radius: 14px; padding: 22px; }
  .eigene h2 { margin: 0 0 12px; font-size: 18px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; border: 1px solid #d1d5db; border-radius: 10px; padding: 12px 14px; font-size: 16px; }
  form button { background: #111827; color: white; border: none; border-radius: 10px; padding: 0 18px; cursor: pointer; }
</style>
</head>
<body>
<div class="inhalt">
  <h1>Häufige Fragen</h1>
  <div class="unter">… und wenn Ihre nicht dabei ist, beantwortet sie ChrisBot.</div>
  <div id="liste"></div>
  <div class="eigene">
    <h2>Eigene Frage stellen</h2>
    <form id="formular"><input id="eingabe" placeholder="Was möchten Sie wissen?" autocomplete="off"><button>Fragen</button></form>
  </div>
</div>
<script src="../gemeinsam/antworten.js"></script>
<script>
  const liste = document.getElementById("liste");

  // Legt einen aufklappbaren Eintrag an. Die Antwort wird erst beim ersten Aufklappen
  // vom Bot geholt, so dass auch eigene Fragen genauso aussehen wie die vorbereiteten.
  function eintrag(frage, sofortOeffnen) {
    const d = document.createElement("details");
    d.innerHTML = "<summary></summary><p>…</p>";
    d.querySelector("summary").textContent = frage;
    let geholt = false;
    d.addEventListener("toggle", async () => {
      if (!d.open || geholt) return;
      geholt = true;
      d.querySelector("p").textContent = (await frageBot(frage)).text;
    });
    liste.appendChild(d);
    if (sofortOeffnen) d.open = true;
  }
  VORSCHLAEGE.forEach((v) => eintrag(v, false));
  document.getElementById("formular").addEventListener("submit", (e) => {
    e.preventDefault();
    const eingabe = document.getElementById("eingabe");
    if (eingabe.value.trim()) eintrag(eingabe.value.trim(), true);
    eingabe.value = "";
  });
</script>
</body>
</html>
