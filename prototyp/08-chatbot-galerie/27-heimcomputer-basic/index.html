<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>27 · 8-Bit-Heimcomputer</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #7b71d6; min-height: 100vh; display: grid; place-items: center; font-family: "Courier New", monospace; }
  .schirm { width: min(760px, 94vw); height: min(540px, 80vh); background: #3e31a2; color: #7b71d6; padding: 22px; font-size: clamp(13px, 2vw, 18px); font-weight: bold; line-height: 1.3; text-transform: uppercase; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  .zeile { display: flex; } input { flex: 1; background: none; border: none; color: inherit; font: inherit; text-transform: uppercase; outline: none; caret-color: transparent; padding: 0; }
  .block { display: inline-block; width: .65em; height: 1em; background: #7b71d6; animation: blink .6s steps(1) infinite; vertical-align: text-bottom; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="schirm" id="schirm"></div>
<script src="../gemeinsam/antworten.js"></script>
<script>
  // BASIC-Interpreter für Arme: PRINT "…" gibt Text aus, LIST zeigt ein kleines Programm,
  // RUN startet es (es fragt dann nach einer Frage), alles andere ist ?SYNTAX ERROR –
  // es sei denn, es endet mit "?", dann antwortet der Bot. Großschreibung wie damals.
  const schirm = document.getElementById("schirm");
  const PROGRAMM = '10 PRINT "FRAGE AN CHRIS";\n20 INPUT F$\n30 GOSUB 1000: REM CHRISBOT\n40 PRINT A$\n50 GOTO 10';
  let modus = "direkt";

  function aus(text) { schirm.insertBefore(document.createTextNode(text + "\n"), schirm.querySelector(".zeile")); schirm.scrollTop = schirm.scrollHeight; }
  async function verarbeite(zeile) {
    const z = zeile.trim().toUpperCase();
    if (modus === "programm") {
      const { text } = await frageBot(zeile);
      aus(text.toUpperCase());
      aus("FRAGE AN CHRIS? ");
      return;
    }
    if (z === "LIST") aus(PROGRAMM);
    else if (z === "RUN") { modus = "programm"; aus("FRAGE AN CHRIS? "); }
    else if (z.startsWith("PRINT")) aus(z.replace(/^PRINT\s*"?|"$/g, ""));
    else if (z.startsWith("LOAD")) { aus("PRESS PLAY ON TAPE"); setTimeout(() => aus("LOADING\nREADY."), 1500); }
    else if (z === "HELP" || z === "HILFE") aus("BEFEHLE: LIST, RUN, PRINT, LOAD. ODER FRAGE MIT ? AM ENDE. VORSCHLAEGE:\n" + VORSCHLAEGE.map((v) => v.toUpperCase()).join("\n"));
    else if (z.endsWith("?")) aus((await frageBot(zeile)).text.toUpperCase() + "\nREADY.");
    else if (z) aus("?SYNTAX  ERROR\nREADY.");
  }
  function eingabezeile() {
    const z = document.createElement("div");
    z.className = "zeile";
    z.innerHTML = '<input autocomplete="off" spellcheck="false"><span class="block"></span>';
    schirm.appendChild(z);
    const input = z.querySelector("input");
    input.focus();
    input.addEventListener("keydown", async (e) => {
      if (e.key === "Escape") { modus = "direkt"; aus("\nBREAK IN 20\nREADY."); return; }
      if (e.key !== "Enter") return;
      const wert = input.value;
      input.value = "";
      aus(wert);
      await verarbeite(wert);
    });
  }
  schirm.onclick = () => schirm.querySelector("input").focus();
  schirm.textContent = "\n    **** CHRIS 64 BASIC V2 ****\n\n 64K RAM SYSTEM  38911 BASIC BYTES FREE\n\nREADY.\n";
  eingabezeile();
  aus('TIPP: RUN, ODER "WER BIST DU?" (ESC = BREAK)');
</script>
</body>
</html>
