<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labyrinth-Prototyp 4: Robin Hood</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      font: 14px/1.4 system-ui, sans-serif;
      color: #d7dce5;
      background: #161b22;
    }
    #stage { flex: 1; min-width: 0; }
    #maze { width: 100%; height: 100%; display: block; }
    #controls {
      width: 290px; padding: 16px; overflow-y: auto;
      background: #161b22; border-left: 1px solid #2a3140;
    }
    #controls h2 {
      margin: 18px 0 8px; font-size: 12px; letter-spacing: 0.08em;
      text-transform: uppercase; opacity: 0.6;
    }
    #controls h2:first-child { margin-top: 0; }
    label { display: block; margin-bottom: 10px; }
    label span { float: right; opacity: 0.6; }
    input[type=text], input[type=number], select {
      width: 100%; padding: 6px 8px; margin-top: 4px;
      font: inherit; color: inherit;
      background: #0d1117; border: 1px solid #2a3140; border-radius: 4px;
    }
    input[type=range] { width: 100%; margin: 4px 0 0; }
    button {
      width: 100%; padding: 8px; margin-bottom: 6px;
      font: inherit; color: inherit; cursor: pointer;
      background: #232b3a; border: 1px solid #2a3140; border-radius: 4px;
    }
    button:hover { background: #2d3749; }
    .buttonRow { display: flex; gap: 6px; }
    input[type=checkbox] { margin-right: 4px; }
    #hint { color: #ffb86b; }
    #status { font-size: 12px; opacity: 0.6; margin-bottom: 10px; }

    @media (max-width: 700px) {
      body { flex-direction: column; height: auto; }
      #stage { height: 70vh; flex: none; }
      #controls { width: 100%; border-left: none; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="maze"></canvas>
  </div>

  <div id="controls">
    <h2>Nachricht</h2>
    <label>Text (A–Z, ÄÖÜ, 0–9)
      <input type="text" id="text" value="CHRISTIAN HÖRAUF">
    </label>
    <div id="hint"></div>
    <div id="status"></div>
    <button id="replay">Nochmal abspielen</button>
    <div class="buttonRow">
      <button id="jumpToEnd">Ans Ende springen</button>
      <button id="pause">Pause</button>
    </div>

    <h2>Verfolgungsjagd</h2>
    <label>Tempo (Zellen pro Sekunde) <span data-for="speed"></span>
      <input type="range" id="speed" min="2" max="120" value="16">
    </label>
    <label>Anzahl der Wachen <span data-for="guardCount"></span>
      <input type="range" id="guardCount" min="0" max="200" value="50">
    </label>
    <label>Vorsprung von Robin Hood (Zellen) <span data-for="headStart"></span>
      <input type="range" id="headStart" min="1" max="20" step="0.5" value="4">
    </label>
    <label>Abstand zwischen den Wachen (Zellen) <span data-for="guardSpacing"></span>
      <input type="range" id="guardSpacing" min="0.5" max="3" step="0.1" value="0.9">
    </label>
    <label>Größe der Figuren (%) <span data-for="figureScale"></span>
      <input type="range" id="figureScale" min="60" max="160" step="5" value="100">
    </label>

    <h2>Text erkennen</h2>
    <label>Fackelschein in Buchstaben-Gängen (%) <span data-for="torchlight"></span>
      <input type="range" id="torchlight" min="0" max="100" step="5" value="65">
    </label>
    <label>Fackelschein auf Verbindungswegen (%) <span data-for="connectorTorchlight"></span>
      <input type="range" id="connectorTorchlight" min="0" max="100" step="5" value="10">
    </label>
    <label>
      <input type="checkbox" id="showFootprints"> Spur zusätzlich zeigen (Robin Hoods Fußspuren bleiben liegen)
    </label>
    <label>
      <input type="checkbox" id="showPlannedPath"> Geplanten Weg gestrichelt zeigen
    </label>

    <h2>Eingang und Ausgang</h2>
    <label>Robin Hood kommt von
      <select id="entranceSide">
        <option value="random">zufällig</option>
        <option value="left">links</option>
        <option value="top">oben</option>
        <option value="bottom">unten</option>
      </select>
    </label>
    <label>Robin Hood flieht nach
      <select id="exitSide">
        <option value="random">zufällig</option>
        <option value="right">rechts</option>
        <option value="top">oben</option>
        <option value="bottom">unten</option>
      </select>
    </label>
    <label>Umwege bei An- und Ablauf <span data-for="detour"></span>
      <input type="range" id="detour" min="0" max="100" value="30">
    </label>

    <h2>Burg</h2>
    <label>Seed
      <input type="number" id="seed" value="1">
    </label>
    <button id="newSeed">Neue Burg (neuer Seed)</button>
    <label>Zellgröße <span data-for="cellSize"></span>
      <input type="range" id="cellSize" min="14" max="64" value="30">
    </label>
    <label>Gewundenheit der Gänge <span data-for="windiness"></span>
      <input type="range" id="windiness" min="0" max="100" value="70">
    </label>
    <label>Mauerstärke (% der Zellgröße) <span data-for="wallThickness"></span>
      <input type="range" id="wallThickness" min="15" max="45" value="30">
    </label>
  </div>

  <script src="schrift.js"></script>
  <script src="labyrinth.js"></script>
  <script src="burg.js"></script>
  <script src="figuren.js"></script>
  <script src="seite.js"></script>
</body>
</html>
