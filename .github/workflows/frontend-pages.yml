# Baut das Frontend und liefert es über GitHub Pages aus.
# Läuft bei Push auf master, wenn sich frontend/ oder dieser Workflow ändert, und per Hand.
# Die Adresse des Backends kommt aus der Repository-Variable ANSWER_URL
# (Settings > Secrets and variables > Actions > Variables); ohne sie antwortet die Seite aus content.json.
name: Frontend auf GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Ausrollen zur Zeit; ein laufendes wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          VITE_ANSWER_URL: ${{ vars.ANSWER_URL }}
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
