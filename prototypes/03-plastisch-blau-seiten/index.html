<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labyrinth-Prototyp 3: plastisch, blau, mehrere Seiten</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      font: 14px/1.4 system-ui, sans-serif;
      color: #d7dce5;
      background: #161b22;
    }
    #stage { flex: 1; min-width: 0; }
    #maze { width: 100%; height: 100%; display: block; }
    #controls {
      width: 290px; padding: 16px; overflow-y: auto;
      background: #161b22; border-left: 1px solid #2a3140;
    }
    #controls h2 {
      margin: 18px 0 8px; font-size: 12px; letter-spacing: 0.08em;
      text-transform: uppercase; opacity: 0.6;
    }
    #controls h2:first-child { margin-top: 0; }
    label { display: block; margin-bottom: 10px; }
    label span { float: right; opacity: 0.6; }
    input[type=text], input[type=number], select {
      width: 100%; padding: 6px 8px; margin-top: 4px;
      font: inherit; color: inherit;
      background: #0d1117; border: 1px solid #2a3140; border-radius: 4px;
    }
    input[type=range] { width: 100%; margin: 4px 0 0; }
    input[type=color] { float: right; width: 44px; height: 24px; padding: 0; border: none; background: none; }
    button {
      width: 100%; padding: 8px; margin-bottom: 6px;
      font: inherit; color: inherit; cursor: pointer;
      background: #232b3a; border: 1px solid #2a3140; border-radius: 4px;
    }
    button:hover { background: #2d3749; }
    .buttonRow { display: flex; gap: 6px; }
    #pageStatus { font-size: 16px; font-weight: 600; color: #7fb4ff; }
    #status { font-size: 12px; opacity: 0.6; margin-bottom: 10px; }

    @media (max-width: 700px) {
      body { flex-direction: column; height: auto; }
      #stage { height: 70vh; flex: none; }
      #controls { width: 100%; border-left: none; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="maze"></canvas>
  </div>

  <div id="controls">
    <h2>Nachricht</h2>
    <label>Text (A–Z, ÄÖÜ, 0–9)
      <input type="text" id="text" value="CHRISTIAN HÖRAUF SAGT HALLO UND FREUT SICH ÜBER IHREN BESUCH">
    </label>
    <div id="pageStatus"></div>
    <div id="status"></div>
    <button id="replay">Nochmal abspielen (ab Seite 1)</button>
    <button id="skipPage">Diese Seite überspringen</button>

    <h2>Farbschema</h2>
    <div class="buttonRow">
      <button id="themeLight">Hell</button>
      <button id="themeDark">Dunkel</button>
    </div>

    <h2>Leuchtspur</h2>
    <label>Leuchtet voll für (Sekunden) <span data-for="holdSeconds"></span>
      <input type="range" id="holdSeconds" min="0" max="10" step="0.1" value="0.8">
    </label>
    <label>Blendet danach aus innerhalb von (Sekunden) <span data-for="fadeSeconds"></span>
      <input type="range" id="fadeSeconds" min="0" max="10" step="0.1" value="0.8">
    </label>
    <label>Rest-Helligkeit danach (%, 100 = Text bleibt stehen) <span data-for="restBrightness"></span>
      <input type="range" id="restBrightness" min="0" max="100" value="0">
    </label>

    <h2>Seiten</h2>
    <label>Höchstens Zeilen pro Seite <span data-for="maxLinesPerPage"></span>
      <input type="range" id="maxLinesPerPage" min="1" max="12" value="12">
    </label>
    <label>Dauer des Seitenwechsels (Sekunden) <span data-for="scrollSeconds"></span>
      <input type="range" id="scrollSeconds" min="0" max="4" step="0.1" value="1.2">
    </label>

    <h2>Eingang und Ausgang</h2>
    <label>Lichtpunkt kommt auf Seite 1 von
      <select id="entranceSide">
        <option value="random">zufällig</option>
        <option value="left">links</option>
        <option value="top">oben</option>
        <option value="bottom">unten</option>
      </select>
    </label>
    <label>Lichtpunkt verlässt jede Seite nach
      <select id="exitSide">
        <option value="random">zufällig</option>
        <option value="right">rechts</option>
        <option value="top">oben</option>
        <option value="bottom">unten</option>
      </select>
    </label>
    <label>Umwege bei An- und Ablauf <span data-for="detour"></span>
      <input type="range" id="detour" min="0" max="100" value="30">
    </label>

    <h2>Labyrinth</h2>
    <label>Seed
      <input type="number" id="seed" value="1">
    </label>
    <button id="newSeed">Neues Labyrinth (neuer Seed)</button>
    <label>Zellgröße <span data-for="cellSize"></span>
      <input type="range" id="cellSize" min="8" max="48" value="24">
    </label>
    <label>Gewundenheit der Gänge <span data-for="windiness"></span>
      <input type="range" id="windiness" min="0" max="100" value="70">
    </label>

    <h2>Lichtpunkt und Spur</h2>
    <label>Tempo (Zellen pro Sekunde) <span data-for="speed"></span>
      <input type="range" id="speed" min="5" max="200" value="40">
    </label>
    <label>Sichtbarkeit der Verbindungswege (%) <span data-for="connectorOpacity"></span>
      <input type="range" id="connectorOpacity" min="0" max="100" value="25">
    </label>
    <label>Spurstärke <span data-for="trailWidth"></span>
      <input type="range" id="trailWidth" min="1" max="16" value="5">
    </label>
    <label>Leuchten <span data-for="glow"></span>
      <input type="range" id="glow" min="0" max="40" value="8">
    </label>
    <label>
      <input type="checkbox" id="showPlannedPath"> Geplanten Weg gestrichelt zeigen
    </label>

    <h2>Plastische Wände</h2>
    <label>Wandstärke <span data-for="wallWidth"></span>
      <input type="range" id="wallWidth" min="1" max="16" value="8">
    </label>
    <label>Schattenversatz <span data-for="shadowOffset"></span>
      <input type="range" id="shadowOffset" min="0" max="16" value="4">
    </label>
    <label>Schattenweichheit <span data-for="shadowBlur"></span>
      <input type="range" id="shadowBlur" min="0" max="24" value="5">
    </label>
    <label>Schattenstärke (%) <span data-for="shadowStrength"></span>
      <input type="range" id="shadowStrength" min="0" max="100" value="45">
    </label>
    <label>Kantenlicht (%) <span data-for="edgeLight"></span>
      <input type="range" id="edgeLight" min="0" max="100" value="35">
    </label>

    <h2>Farben</h2>
    <label>Hintergrund <input type="color" id="backgroundColor" value="#f3f3f1"></label>
    <label>Wände <input type="color" id="wallColor" value="#a4a6a9"></label>
    <label>Schatten <input type="color" id="shadowColor" value="#3a3c40"></label>
    <label>Spur <input type="color" id="trailColor" value="#1466ff"></label>
    <label>Lichtpunkt <input type="color" id="dotColor" value="#0a55f0"></label>
  </div>

  <script src="schrift.js"></script>
  <script src="labyrinth.js"></script>
  <script src="seite.js"></script>
</body>
</html>
